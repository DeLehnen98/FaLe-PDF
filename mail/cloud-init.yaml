#cloud-config
# FaLe Mail server (mail.fale.network) – Ubuntu 24.04 LTS. Contains NO secrets: every password/key is generated
# on the server. GENERATED by mail/tools/build.mjs from mail/server/* and mail/config/versions.json – do not edit.
# Paste this whole file into the provider's "Cloud config" / "User data" field. Docs: docs/FALE-MAIL.md
hostname: mail
fqdn: mail.fale.network
prefer_fqdn_over_hostname: true
timezone: Europe/Berlin
ssh_pwauth: false
disable_root: true
package_update: true
package_upgrade: true
packages: [unattended-upgrades, ufw, unbound, restic, git, python3-cryptography, openssl, ca-certificates, curl, xz-utils]
write_files:
  - path: /etc/fale-mail/pins.env
    permissions: '0644'
    content: |
      STALWART_VERSION=0.16.25
      STALWART_SHA256_X86_64=8ba9cc0ea2795121df5c1264af41e82353c5a3d6860161c4ab70817906d912d3
      STALWART_SHA256_AARCH64=7fc867e8bac70e00c372e8c8e8bc0e73e5f367f797daa5446f8c79225bdfb7e1
      CLI_VERSION=1.0.13
      CLI_SHA256_X86_64=1b8509b767edd1a17693e092b518c41610ec4b724f4e62c461bd28cd40c669f7
      CLI_SHA256_AARCH64=65f4b6e528d84388953fc98d946339dd8246fb03bf4caaa64e1d9b378f52d892
      MAIL_HOST=mail.fale.network
      MAIL_DOMAIN=fale.network
      FALE_SSH=off
  - path: /usr/local/lib/fale-mail/firstboot.sh
    permissions: '0755'
    encoding: gz+b64
    # source: mail/server/firstboot.sh (sha256 6cced9d02076a4e91c47d3a5880a5f0f7a2a218c6aca426e1caf5141b21f076a)
    content: 
  - path: /usr/local/lib/fale-mail/fale-mail-agent.py
    permissions: '0755'
    encoding: gz+b64
    # source: mail/server/fale-mail-agent.py (sha256 b746fbfe885fe1292c3e3534ef8b67c3598ed029d50540b31df8a6ec58abfa29)
    content: 
runcmd:
  - [bash, /usr/local/lib/fale-mail/firstboot.sh]
final_message: "FaLe Mail first boot finished after $UPTIME s – status: https://mail.fale.network/fale/status.json"
