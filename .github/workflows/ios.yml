# Builds the FaLe PDF iPhone/iPad app (Capacitor iOS) for the iOS Simulator and tests it there – no Apple account
# needed for this. The ios/ folder is not committed: it is generated on every run and patched deterministically by
# scripts/cap-patch-ios.mjs; the app's own native code lives in ios-native/ (CocoaPods pod "FaleNative").
# App Store builds need an Apple Developer account + signing (see store/IOS-SETUP.md) and are not made here yet.
name: iOS

on:
  push:
    branches: [main]
    paths-ignore: ['network/**', 'one/**', 'one-android/**', 'store/**', 'docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      LOG: ${{ github.workspace }}/../ios-build.log
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Toolchain
        run: |
          xcodebuild -version | tee -a "$LOG"
          pod --version | tee -a "$LOG"
          echo "::notice title=iOS toolchain::$(xcodebuild -version | tr '\n' ' ') · CocoaPods $(pod --version)"

      - name: Install npm packages
        run: npm install --no-audit --no-fund 2>&1 | tail -n 20 | tee -a "$LOG"

      - name: Build web app (native target)
        run: node scripts/vercel-build.mjs --native 2>&1 | tee -a "$LOG"

      - name: Create iOS project + patch + pods
        env:
          FALE_E2E: '1' # test build: adds the fale-e2e:// scheme the simulator test uses (never in release builds)
        run: |
          npx cap add ios --packagemanager CocoaPods 2>&1 | tee -a "$LOG" || true
          test -d ios/App || { echo "::error title=iOS::cap add ios hat kein Projekt erzeugt"; exit 1; }
          node scripts/cap-patch-ios.mjs 2>&1 | tee -a "$LOG"
          npx cap sync ios 2>&1 | tee -a "$LOG"
          node scripts/cap-patch-ios.mjs 2>&1 | tee -a "$LOG"   # sync may rewrite parts – patch again (idempotent)
          (cd ios/App && pod install 2>&1 | tail -n 30) | tee -a "$LOG"

      - name: Project facts (Capacitor version, app delegate URL handling)
        run: |
          V=$(node -p "require('@capacitor/ios/package.json').version")
          D=$(grep -hn "open url\|openURLContexts\|ApplicationDelegateProxy\|SceneDelegateProxy" ios/App/App/*.swift | tr '\n' ' ' | head -c 600)
          echo "::notice title=iOS Projekt::@capacitor/ios $V · Dateien: $(ls ios/App/App | tr '\n' ' ') · $D"

      - name: Build for the simulator (no signing)
        run: |
          set +e
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1
          rc=$?
          set -e
          tail -n 40 xcodebuild.log
          if [ $rc -ne 0 ]; then
            # errors as annotations (readable without downloading logs)
            grep -E "error:|fatal error|Undefined symbol|ld: " xcodebuild.log | sort -u | head -n 25 | while IFS= read -r l; do
              echo "::error title=iOS build::${l//$'\n'/ }"
            done
            exit $rc
          fi
          echo "::notice title=iOS build::App für den Simulator gebaut"

      - name: Simulator test (start, open a file, write back, screenshot tour)
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/App.app
          test -d "$APP" || { echo "::error title=iOS test::App.app nicht gefunden"; exit 1; }
          UDID=$(python3 scripts/ios-e2e/pick_sim.py iphone)
          test -n "$UDID" || { echo "::error title=iOS test::kein iPhone-Simulator verfügbar"; exit 1; }
          echo "::notice title=iOS Simulator::iPhone: $(xcrun simctl list devices | grep "$UDID" | head -n 1 | xargs)"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          echo "::notice title=iOS Info.plist::$(plutil -extract CFBundleURLTypes json -o - "$APP/Info.plist" 2>&1 | head -c 300) · FaleE2E=$(plutil -extract FaleE2E raw -o - "$APP/Info.plist" 2>&1) · Szene=$(plutil -extract UIApplicationSceneManifest json -o - "$APP/Info.plist" 2>&1 | head -c 200)"
          python3 scripts/ios-e2e/run.py "$UDID" dev.fale.pdf iphone
          xcrun simctl shutdown "$UDID" || true

      - name: iPad test (same checks + screenshots)
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/App.app
          UDID=$(python3 scripts/ios-e2e/pick_sim.py ipad)
          test -n "$UDID" || { echo "::warning title=iPad::kein iPad-Simulator verfügbar"; exit 0; }
          echo "::notice title=iOS Simulator::iPad: $(xcrun simctl list devices | grep "$UDID" | head -n 1 | xargs)"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          python3 scripts/ios-e2e/run.py "$UDID" dev.fale.pdf ipad
          xcrun simctl shutdown "$UDID" || true

      # Try the app in a browser without an iPhone: upload FaLe-PDF-Simulator.zip (inside the downloaded artifact)
      # to a simulator-in-the-browser service such as Appetize (see store/IOS-SETUP.md, „Ohne iPhone testen“).
      - name: Package simulator app
        if: success()
        run: |
          mkdir -p ios-sim-app
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/App.app ios-sim-app/FaLe-PDF-Simulator.zip
          echo "::notice title=iOS Simulator-App::FaLe-PDF-Simulator.zip $(du -h ios-sim-app/FaLe-PDF-Simulator.zip | cut -f1) – zum Ausprobieren im Browser (Artefakt FaLe-PDF-iOS-Simulator-App)"

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FaLe-PDF-iOS-Simulator-App
          path: ios-sim-app/FaLe-PDF-Simulator.zip
          retention-days: 30

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FaLe-PDF-iOS-Screenshots
          path: ios-e2e-out/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-sim-test
          path: |
            xcodebuild.log
            ios-e2e-out/*.txt
          if-no-files-found: ignore
          retention-days: 14
