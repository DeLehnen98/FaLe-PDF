# Wendet neue SQL-Migrationen aus supabase/migrations/ auf die Supabase-Datenbank an.
# Einmalig nötig: Repository-Secret SUPABASE_DB_URL = "Session pooler"-Verbindungszeichenfolge
# aus Supabase → Connect (mit Passwort). Jede Datei wird genau einmal angewendet (Protokoll in
# private.fale_migrations), jeweils in einer eigenen Transaktion.
name: DB migrate

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/db-migrate.yml']
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Check secret
        id: chk
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::warning title=DB migrate::Secret SUPABASE_DB_URL fehlt – Migrationen werden übersprungen."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Install psql
        if: steps.chk.outputs.skip != '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
      - name: Test connection
        if: steps.chk.outputs.skip != '1'
        run: |
          set +e
          info=$(python3 - <<'PY' 2>&1
          import os, re, urllib.parse as u
          raw = os.environ.get('DB_URL', '').strip()
          hints = []
          if raw.startswith('"') or raw.startswith("'"): hints.append('Anfuehrungszeichen um die Zeile entfernen')
          if not re.match(r'^postgres(ql)?://', raw): hints.append('beginnt nicht mit postgresql://')
          if '[YOUR-PASSWORD]' in raw: hints.append('Platzhalter [YOUR-PASSWORD] wurde nicht ersetzt')
          try:
              p = u.urlsplit(raw); host = p.hostname; port = p.port; user = p.username; pw = p.password or ''; db = p.path.lstrip('/')
          except Exception as e:
              print(f"URL nicht lesbar ({type(e).__name__}) – vermutlich Sonderzeichen im Passwort (z. B. @ : / ? # [ ]), die kodiert werden muessen; hints={'; '.join(hints) or '-'}")
              raise SystemExit(0)
          if host and host.startswith('db.') and host.endswith('.supabase.co'): hints.append('direkte Verbindung (nur IPv6) – bitte die Session-Pooler-Zeile nehmen')
          if any(c in pw for c in '@:/?#%[] '): hints.append('Passwort enthaelt Sonderzeichen, die in der URL kodiert werden muessen')
          print(f"user={user} host={host} port={port} db={db} pw_len={len(pw)} hints={'; '.join(hints) or '-'}")
          PY
          )
          echo "::notice title=DB-Verbindung (ohne Passwort)::$info"
          if ! err=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tA -c "select current_user, version()" 2>&1); then
            clean=$(echo "$err" | sed -E 's#postgres(ql)?://[^ ]*#<url>#g' | head -n 5 | tr '\n' ' ')
            echo "::error title=DB-Verbindung fehlgeschlagen::$clean"
            exit 1
          fi
          echo "::notice title=DB-Verbindung ok::$(echo "$err" | cut -c1-120)"

      - name: Apply pending migrations
        if: steps.chk.outputs.skip != '1'
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "create schema if not exists private; create table if not exists private.fale_migrations (name text primary key, applied_at timestamptz not null default now()); revoke all on private.fale_migrations from public;"
          # Migrations that were applied by hand before this workflow existed
          if [ -f supabase/migrations/.baseline ]; then
            while read -r b; do
              [ -n "$b" ] && psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "insert into private.fale_migrations(name) values ('$b') on conflict do nothing;"
            done < supabase/migrations/.baseline
          fi
          applied=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            n=$(basename "$f")
            done_=$(psql "$DB_URL" -tA -c "select 1 from private.fale_migrations where name = '$n'")
            if [ "$done_" = "1" ]; then echo "✓ $n (bereits angewendet)"; continue; fi
            echo "→ $n"
            if ! out=$(psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q -f "$f" 2>&1); then
              echo "$out"
              msg=$(echo "$out" | tail -n 15 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=Migration $n fehlgeschlagen::$msg"
              exit 1
            fi
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "insert into private.fale_migrations(name) values ('$n');"
            applied=$((applied+1))
          done
          echo "::notice title=DB migrate::$applied neue Migration(en) angewendet."
