# Wendet neue SQL-Migrationen aus supabase/migrations/ auf die Supabase-Datenbank an.
# Einmalig nötig: Repository-Secret SUPABASE_DB_URL = "Session pooler"-Verbindungszeichenfolge
# aus Supabase → Connect (mit Passwort). Jede Datei wird genau einmal angewendet (Protokoll in
# private.fale_migrations), jeweils in einer eigenen Transaktion.
name: DB migrate

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/db-migrate.yml']
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Check secret
        id: chk
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::warning title=DB migrate::Secret SUPABASE_DB_URL fehlt – Migrationen werden übersprungen."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Install psql
        if: steps.chk.outputs.skip != '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
      - name: Resolve connection (pooler, IPv4)
        if: steps.chk.outputs.skip != '1'
        run: |
          set +e
          python3 - <<'PY'
          import os, re
          raw = os.environ.get('DB_URL', '').strip().strip('"').strip("'")
          m = re.match(r'^postgres(?:ql)?://(.*)$', raw)
          if not m:
              print('::error title=DB-Verbindung::SUPABASE_DB_URL beginnt nicht mit postgresql://'); raise SystemExit(1)
          rest = m.group(1)
          if '@' not in rest:
              print('::error title=DB-Verbindung::Kein @ in der Zeile gefunden'); raise SystemExit(1)
          userinfo, hostpart = rest.rsplit('@', 1)      # password may contain @ : / ? # – split on the LAST @
          user, _, pw = userinfo.partition(':')
          from urllib.parse import unquote
          pw = unquote(pw) if re.search(r'%[0-9A-Fa-f]{2}', pw) else pw
          hostport, _, db = hostpart.partition('/')
          db = (db.split('?')[0] or 'postgres')
          host, _, port = hostport.partition(':')
          port = port or '5432'
          if '[YOUR-PASSWORD]' in pw:
              print('::error title=DB-Verbindung::Platzhalter [YOUR-PASSWORD] wurde nicht ersetzt'); raise SystemExit(1)
          cands = []
          mm = re.match(r'^db\.([a-z0-9]+)\.supabase\.co$', host)
          if mm:  # direct host is IPv6-only – GitHub runners need the IPv4 session pooler
              ref = mm.group(1)
              for h in ('aws-0-eu-central-1.pooler.supabase.com', 'aws-1-eu-central-1.pooler.supabase.com'):
                  cands.append((h, '5432', f'postgres.{ref}'))
          else:
              cands.append((host, port, user))
          print('::add-mask::' + pw)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'PGPASSWORD={pw}\nPGDATABASE={db}\nPGSSLMODE=require\nPGCONNECT_TIMEOUT=15\n')
          fd = os.open('/tmp/pgpw', os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          os.write(fd, pw.encode()); os.close(fd)
          with open('/tmp/pg_cands', 'w') as f:
              for c in cands: f.write(' '.join(c) + '\n')
          print(f"::notice title=DB-Verbindung::Kandidaten: {', '.join(c[0] + ' (' + c[2] + ')' for c in cands)}; Passwortlaenge {len(pw)}")
          PY
          [ -s /tmp/pg_cands ] || exit 1
          while read -r h p u; do
            if out=$(PGPASSWORD="$(cat /tmp/pgpw)" PGDATABASE=postgres PGSSLMODE=require PGCONNECT_TIMEOUT=15 PGHOST="$h" PGPORT="$p" PGUSER="$u" psql -tA -c "select current_user" 2>&1); then
              echo "PGHOST=$h" >> "$GITHUB_ENV"; echo "PGPORT=$p" >> "$GITHUB_ENV"; echo "PGUSER=$u" >> "$GITHUB_ENV"
              echo "::notice title=DB-Verbindung ok::$h als $out"
              rm -f /tmp/pgpw
              exit 0
            else
              echo "::warning title=DB-Verbindung $h::$(echo "$out" | head -n 3 | tr '\n' ' ')"
            fi
          done < /tmp/pg_cands
          echo "::error title=DB-Verbindung fehlgeschlagen::Keine Verbindung möglich (siehe Warnungen)."
          rm -f /tmp/pgpw
          exit 1

      - name: Apply pending migrations
        if: steps.chk.outputs.skip != '1'
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -c "create schema if not exists private; create table if not exists private.fale_migrations (name text primary key, applied_at timestamptz not null default now()); revoke all on private.fale_migrations from public;"
          # Migrations that were applied by hand before this workflow existed
          if [ -f supabase/migrations/.baseline ]; then
            while read -r b; do
              [ -n "$b" ] && psql -v ON_ERROR_STOP=1 -q -c "insert into private.fale_migrations(name) values ('$b') on conflict do nothing;"
            done < supabase/migrations/.baseline
          fi
          applied=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            n=$(basename "$f")
            done_=$(psql -tA -c "select 1 from private.fale_migrations where name = '$n'")
            if [ "$done_" = "1" ]; then echo "✓ $n (bereits angewendet)"; continue; fi
            echo "→ $n"
            if ! out=$(psql -v ON_ERROR_STOP=1 --single-transaction -q -f "$f" 2>&1); then
              echo "$out"
              msg=$(echo "$out" | tail -n 15 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=Migration $n fehlgeschlagen::$msg"
              exit 1
            fi
            psql -v ON_ERROR_STOP=1 -q -c "insert into private.fale_migrations(name) values ('$n');"
            applied=$((applied+1))
          done
          echo "::notice title=DB migrate::$applied neue Migration(en) angewendet."
