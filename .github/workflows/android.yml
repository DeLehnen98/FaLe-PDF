# Builds the FaLe PDF Android app (Capacitor) – APK for sideloading, AAB for Google Play.
# The android/ folder is not committed: it is generated here on every run and patched
# deterministically by scripts/cap-patch-android.mjs.
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to attach files to a GitHub Release on tags

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm packages
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build web app (native target)
        run: node scripts/vercel-build.mjs --native

      - name: Create / sync Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Patch Android project
        run: node scripts/cap-patch-android.mjs

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Decode upload keystore
        if: env.HAS_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "FALE_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release (AAB + APK)
        if: env.HAS_SIGNING == 'true'
        working-directory: android
        env:
          FALE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FALE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FALE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Collect outputs
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/FaLe-PDF-$VERSION-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/FaLe-PDF-$VERSION.apk"
          fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "out/FaLe-PDF-$VERSION.aab"
          fi
          ls -la out

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FaLe-PDF-${{ steps.ver.outputs.version }}-android
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
