# Builds „FaLe PDF für Windows“ (windows/, Tauri 2) as FaLe-PDF-Setup.exe (NSIS, installs without admin rights)
# and publishes it on the pre-release "windows-latest". Smoke test: silent install, start, still running after 25 s.
# Third-party actions are pinned to full commit SHAs (same pins as android.yml).
name: Windows

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml', 'icons/**', 'package.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # attach the Setup.exe to the windows-latest pre-release
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Rust (stable)
        run: rustup default stable && rustc --version
      - name: Company settings (policy.rs) – unit tests
        run: cargo test --manifest-path windows/policy-test/Cargo.toml
      - name: Version from package.json
        run: node scripts/windows-version.mjs
      - name: Icons
        working-directory: windows
        run: npx --yes @tauri-apps/cli@2.12.4 icon ../icons/ios-1024.png
      - name: Build Setup.exe
        working-directory: windows
        # fixed version: installer/hooks.nsh and the language files hook into the installer template of this version
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles nsis
      - name: Collect
        id: out
        run: |
          mkdir -p out
          f=$(ls windows/src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          cp "$f" out/FaLe-PDF-Setup.exe
          (cd out && sha256sum FaLe-PDF-Setup.exe > FaLe-PDF-Setup.exe.sha256)
          ls -la out
          echo "size=$(stat -c %s out/FaLe-PDF-Setup.exe)" >> "$GITHUB_OUTPUT"
      - name: Smoke test (silent install, start, does not hang or crash)
        shell: pwsh
        run: |
          # a picture of the screen for the design review – never fails the build
          function Save-Screen($name) {
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              New-Item -ItemType Directory -Force -Path shots | Out-Null
              $bmp.Save((Join-Path (Resolve-Path shots) $name), [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
              Write-Host "Screenshot $name ($($b.Width)x$($b.Height))"
            } catch { Write-Host "::warning title=Screenshot::$name nicht möglich: $($_.Exception.Message)" }
          }
          # 1) the setup WITH its window, the way a person installs: first page, folder, last page (pictures),
          #    then remove it again silently – so the silent installation below starts from a clean PC.
          #    Nothing in this block fails the build; the silent installation and the start are the hard checks.
          try {
            Add-Type -AssemblyName System.Windows.Forms
            $ws = New-Object -ComObject WScript.Shell
            $setup = Start-Process -FilePath "out\FaLe-PDF-Setup.exe" -PassThru
            Start-Sleep -Seconds 8
            Save-Screen "setup-1-willkommen.png"
            [void]$ws.AppActivate($setup.Id); Start-Sleep -Milliseconds 600; [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
            Start-Sleep -Seconds 3
            Save-Screen "setup-2-ordner.png"
            [void]$ws.AppActivate($setup.Id); Start-Sleep -Milliseconds 600; [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
            # installing (WebView2 is on the runner already); the page waits for „Next“ when it is done
            $un = $null
            for ($i = 0; $i -lt 40 -and -not $un; $i++) { Start-Sleep -Seconds 3; $un = Get-ChildItem -Path "$env:LOCALAPPDATA" -Recurse -Filter "uninstall.exe" -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -like "*FaLe PDF*" } | Select-Object -First 1 }
            Start-Sleep -Seconds 6
            [void]$ws.AppActivate($setup.Id); Start-Sleep -Milliseconds 600; [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
            Start-Sleep -Seconds 3
            Save-Screen "setup-3-fertig.png"
            if (-not $setup.HasExited) { Stop-Process -Id $setup.Id -Force }
            if ($un) {
              $u = Start-Process -FilePath $un.FullName -ArgumentList "/S" -PassThru
              if (-not $u.WaitForExit(60000)) { Stop-Process -Id $u.Id -Force }
              Start-Sleep -Seconds 5
              Write-Host "::notice title=Setup mit Fenster::Seiten fotografiert, danach still entfernt ($($un.FullName))"
            } else { Write-Host "::warning title=Setup mit Fenster::Installation nicht gefunden – Bilder prüfen" }
          } catch { Write-Host "::warning title=Setup mit Fenster::$($_.Exception.Message)" }
          # 2) the silent installation (what companies use)
          $p = Start-Process -FilePath "out\FaLe-PDF-Setup.exe" -ArgumentList "/S" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          $exe = Get-ChildItem -Path "$env:LOCALAPPDATA" -Recurse -Filter "fale-pdf.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs","$env:LOCALAPPDATA" -Recurse -Include "FaLe PDF.exe","fale-pdf.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $exe) { throw "Installed program not found" }
          Write-Host "Installed: $($exe.FullName)"
          $pdf = Join-Path $env:RUNNER_TEMP "test.pdf"
          $stream = "BT /F1 28 Tf 72 740 Td (FaLe PDF - Testseite) Tj ET"
          Set-Content -Path $pdf -Value "%PDF-1.4`n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj`n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj`n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>>>>>/Contents 4 0 R>>endobj`n4 0 obj<</Length $($stream.Length)>>stream`n$stream`nendstream endobj`ntrailer<</Root 1 0 R>>`n%%EOF" -Encoding ascii
          $app = Start-Process -FilePath $exe.FullName -ArgumentList "`"$pdf`"" -PassThru
          Start-Sleep -Seconds 25
          if ($app.HasExited) { throw "FaLe PDF exited after start (code $($app.ExitCode))" }
          # the app page really loaded in WebView2: its storage folders exist (service worker / IndexedDB)
          $data = Join-Path $env:LOCALAPPDATA "dev.fale.pdf.desktop\EBWebView\Default"
          $seen = @()
          foreach ($d in @("Service Worker", "IndexedDB", "Local Storage")) { if (Test-Path (Join-Path $data $d)) { $seen += $d } }
          if ($seen.Count -gt 0) { Write-Host "::notice title=Windows-App geladen::WebView2-Daten vorhanden: $($seen -join ', ')" } else { Write-Host "::warning title=Windows-App geladen?::Keine WebView2-Daten unter $data gefunden" }
          Write-Host "::notice title=Windows-Smoke-Test::FaLe PDF läuft nach 25 s noch (Setup ${{ steps.out.outputs.size }} Bytes)"
          # a picture of the real program on Windows (own fonts, title bar) for the design review
          # the first start shows the welcome pages; Esc closes them (for the picture of the program itself)
          try { $ws = New-Object -ComObject WScript.Shell; [void]$ws.AppActivate($app.Id); Start-Sleep -Milliseconds 600; Add-Type -AssemblyName System.Windows.Forms; [System.Windows.Forms.SendKeys]::SendWait("{ESC}"); Start-Sleep -Seconds 3 } catch { Write-Host "Esc: $($_.Exception.Message)" }
          Save-Screen "windows-ansicht.png"
          # the window's X: the program asks the app, nothing is unsaved, so it must close on its own (within 15 s)
          $app.Refresh()
          $sent = $app.CloseMainWindow()
          $closed = $app.WaitForExit(15000)
          if ($closed) { Write-Host "::notice title=Fenster schließen::Das X schließt das Programm (Anfrage gesendet: $sent)" }
          else { Stop-Process -Id $app.Id -Force; throw "The window did not close within 15 s after the close request (sent: $sent)" }
          # second start: the window state file of the first run must not stop the program from starting –
          # this time with company settings on the PC (windows/src-tauri/src/policy.rs): the program must start with
          # them, and the picture shows „Firmen-Einstellungen aktiv“ at the bottom of the (maximised) window
          $polDir = Join-Path $env:ProgramData "FaLe PDF"
          try { New-Item -ItemType Directory -Force -Path $polDir | Out-Null; Set-Content -Path (Join-Path $polDir "policy.json") -Value '{ "internet": false }' -Encoding utf8; Write-Host "Company settings written: $polDir\policy.json" } catch { Write-Host "::warning title=Firmen-Einstellungen::Datei nicht geschrieben: $($_.Exception.Message)" }
          $again = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 12
          if ($again.HasExited) { throw "FaLe PDF exited after the second start with company settings (code $($again.ExitCode))" }
          try {
            Add-Type -Namespace Fale -Name Win -MemberDefinition '[DllImport("user32.dll")] public static extern bool ShowWindow(System.IntPtr h, int n);'
            $again.Refresh(); [void][Fale.Win]::ShowWindow($again.MainWindowHandle, 3); Start-Sleep -Seconds 3
          } catch { Write-Host "Maximise: $($_.Exception.Message)" }
          Save-Screen "windows-start.png"
          $again.Refresh()
          [void]$again.CloseMainWindow()
          if (-not $again.WaitForExit(15000)) { Stop-Process -Id $again.Id -Force; throw "Second run: the window did not close within 15 s" }
      - name: Upload screenshots of the running program
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FaLe-PDF-Windows-Screens
          path: shots/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Screenshots for the design review (draft release – not public)
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls shots/*.png >/dev/null 2>&1 || exit 0
          gh release view windows-screens -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create windows-screens -R "$GITHUB_REPOSITORY" --draft --title "Windows-Bildschirmfotos (Entwurf, nicht öffentlich)" --notes "Automatisch aus dem Windows-Build – nur für die Gestaltungsprüfung." || true
          gh release upload windows-screens shots/*.png -R "$GITHUB_REPOSITORY" --clobber || true
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FaLe-PDF-Setup
          path: out/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove older files from the windows-latest pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-latest -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | while read -r n; do
            gh release delete-asset windows-latest "$n" -R "$GITHUB_REPOSITORY" -y || true
          done || true
      - name: Publish as pre-release windows-latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: windows-latest
          name: FaLe PDF für Windows (Setup.exe)
          prerelease: true
          make_latest: false
          body: |
            FaLe PDF für Windows – automatisch gebaut aus main (${{ github.sha }}).
            Herunterladen: FaLe-PDF-Setup.exe → öffnen → fertig (ohne Administratorrechte).
            Prüfsumme: FaLe-PDF-Setup.exe.sha256
          files: out/*
