  <title>Ausweis kopieren</title>

<body class="wt-in-app">
<main id="main" class="wt-page" data-cat="images">
  <div class="wrap wt-top">
    <p class="wt-lede">Fotografiere Vorder- und Rückseite – du bekommst eine saubere Kopie in Originalgröße, und dein Ausweis verlässt nie dein Gerät.</p>
    <section id="wt-app" class="wt-app" aria-label="Werkzeug: Ausweis kopieren" data-state="pick">
      <div class="wt-pick" data-wt-pick>
        <label class="wt-drop" data-wt-drop>
          <input class="wt-picker" type="file" accept="image/*,.jpg,.jpeg,.png,.webp,.avif,.heic,.heif" multiple data-wt-input>
          <span class="wt-drop-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></span>
          <span class="wt-drop-main">Fotos auswählen</span>
          <span class="wt-drop-sub">oder hierher ziehen</span>
        </label>
        <div class="wt-chips"><label class="wt-chipbtn" data-wt-camera hidden><input class="wt-picker" type="file" accept="image/*" capture="environment" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg><span>Kamera</span></label><button class="wt-chipbtn" type="button" data-wt-paste hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 11h6M9 15h4"/></svg><span>Einfügen</span></button></div>
      </div>
    </section>
  </div>
</main>
